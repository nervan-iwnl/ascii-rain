<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1211"><link rel="icon" href="data:,">
<title>Пока идёт дождь</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1211;color:#b9c9b7;font:12px/1.5 'Courier New',monospace;height:100dvh;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}header{position:absolute;top:26px;left:0;width:100%;text-align:center;pointer-events:none}h1{font-size:13px;letter-spacing:3px;font-weight:normal;margin:0 0 5px}header p{font-size:10px;color:#697b71;margin:0}footer{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:min(490px,calc(100% - 28px));background:#0b1211d9;border-top:1px solid #34443a;padding:9px 4px 0}.row{display:flex;gap:12px;align-items:center;justify-content:center}.row+.row{margin-top:8px}.station{min-width:0;width:150px}select,button{background:transparent;border:0;font:inherit;cursor:pointer}select{color:#a6b79f;max-width:100%;padding:2px 0}option{background:#14221c}#caption{display:block;color:#728475;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}button{color:#829583;min-height:28px;padding:2px 4px}button:hover{color:#d9e4cd}button:focus-visible,input:focus-visible,select:focus-visible{outline:1px solid #adc19a;outline-offset:3px}button[aria-pressed=true]{color:#d8e6cd}.play{width:28px;min-width:28px;font-size:14px}.volume{width:96px;flex-shrink:0}.volume label{font-size:9px;color:#829386;display:flex;justify-content:space-between}.volume output{font-variant-numeric:tabular-nums}input[type=range]{appearance:none;width:100%;height:2px;display:block;background:linear-gradient(to right,#96ac85 var(--level),#34443a var(--level));cursor:pointer;margin:8px 0}input[type=range]::-webkit-slider-thumb{appearance:none;width:7px;height:10px;background:#b4c5a4}input[type=range]::-moz-range-thumb{width:7px;height:10px;border:0;border-radius:0;background:#b4c5a4}.segments{display:flex;align-items:center;gap:4px}.segments span{color:#829386;font-size:10px;margin-right:6px}.segments button{font-size:10px;white-space:nowrap}.segments button[aria-pressed=true]{text-decoration:underline;text-underline-offset:4px}.freeze{font-size:14px;width:24px;padding:0;flex-shrink:0}
.thought{position:absolute;left:0;top:32%;width:100%;text-align:center;color:#8d9f8b;font-size:11px;letter-spacing:2px;pointer-events:none;opacity:0;animation:thought 50s infinite}@keyframes thought{0%,2%,28%,100%{opacity:0}8%,20%{opacity:.8}}@media(prefers-reduced-motion:reduce){.thought{animation:none;opacity:.6}}
</style>
<canvas aria-label="Ночной лес из ASCII-символов: дождь падает, деревья качаются на ветру" role="img"></canvas>
<header><h1>ПОКА ИДЁТ ДОЖДЬ</h1><p>маленькое место, где можно остаться</p></header><div class="thought">никуда не нужно спешить</div>

<footer aria-label="Музыка и погода"><div class="row"><button id="sound" class="play" aria-label="Включить радио" aria-pressed="false" title="Включить радио">▶</button><div class="station"><select id="station" aria-label="Радиостанция"><option value="0">Code Radio</option><option value="1">Groove Salad</option><option value="2">I Love Chillhop</option></select><span id="caption" role="status">лоуфай / джаз</span></div><div class="volume"><label for="musicVolume">Музыка <output id="musicValue" for="musicVolume">40%</output></label><input id="musicVolume" type="range" min="0" max="100" value="40" style="--level:40%"></div></div><div class="row"><div class="segments" role="group" aria-label="Сила дождя"><span>Сила дождя</span><button data-sky="0" aria-pressed="false" aria-label="Выключить дождь">0</button><button data-sky="1" aria-pressed="true" aria-label="Тихий дождь">1</button><button data-sky="2" aria-pressed="false" aria-label="Сильный дождь">2</button></div><div class="volume"><label for="rainVolume">Шум дождя <output id="rainValue" for="rainVolume">60%</output></label><input id="rainVolume" type="range" min="0" max="100" value="60" style="--level:60%"></div><button id="pause" class="freeze" aria-label="Пауза музыки и анимации" title="Пауза музыки и анимации" aria-pressed="false">Ⅱ</button></div></footer>
<script>
const $=s=>document.querySelector(s),canvas=$('canvas'),ctx=canvas.getContext('2d'),sound=$('#sound'),pause=$('#pause');
let w,h,cols,rows,cw=8,ch=14,t=0,last=0,mode=0,wet=true,stopped=false,mediaPaused=false,pointer=0,trees=[],drops=[];
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;stopped=reduced;pause.setAttribute('aria-pressed',stopped);pause.textContent=stopped?'▶':'Ⅱ';pause.setAttribute('aria-label',stopped?'Продолжить музыку и анимацию':'Пауза музыки и анимации');
function rand(n){return Math.random()*n}function resize(){w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);cw=8;ch=14;cols=Math.ceil(w/cw);rows=Math.ceil(h/ch);ctx.font=`${ch-2}px "Courier New",monospace`;trees=[];let seed=73;function r(){seed=(seed*16807)%2147483647;return seed/2147483647}for(let layer=0;layer<3;layer++){let count=Math.ceil(cols/(layer===2?26:16));for(let i=0;i<count;i++)trees.push({x:(i+.15+r()*.65)*cols/count,y:rows*(.67+layer*.075),height:(8+r()*9)*(layer===2?1.2:.8),phase:r()*6.28,layer,shape:r()>.3});}drops=Array.from({length:Math.ceil(cols*rows*.045)},()=>({x:rand(cols),y:rand(rows),speed:8+rand(16),z:rand(1)}));draw(0)}
function glyph(c,x,y,color){if(x<0||x>cols||y<0||y>rows)return;ctx.fillStyle=color;ctx.fillText(c,Math.round(x)*cw,Math.round(y)*ch)}
function draw(dt){ctx.fillStyle='#0b1211';ctx.fillRect(0,0,w,h);const storm=wet&&mode;const wind=(Math.sin(t*.37)*.8+Math.sin(t*.91)*.25)*(storm?2.5:1)+pointer*.7+(storm?1.8:0);
const mx=cols*.79,my=rows*.22;[' .---. ','/ . . \\','| .   |','\\   . /'," '---' "].forEach((s,i)=>[...s].forEach((c,j)=>glyph(c,mx+j,my+i,'#627466')));
for(let j=0;j<cols;j+=3){const y=rows*.43+Math.sin(j*.12)*1.4;glyph(j%2?'_':'.',j,y,'#1c2c26')}
for(const tree of trees){const colors=['#263e33','#45654e','#86a07b'],height=Math.floor(tree.height),base=tree.y;for(let k=height;k>=0;k--){const bend=(Math.sin(t*(storm?1.4:.8)+tree.phase)*(storm?1.5:.8)+wind)*Math.pow(k/height,2)*(tree.layer+1);const x=tree.x+bend,y=base-k;if(k<height*.26){glyph(k%2?'|':'H',x,y,colors[tree.layer]);if(tree.layer===2)glyph('|',x+1,y,colors[tree.layer]);continue}const spread=tree.shape?Math.max(0,(height-k)*.49):Math.sin((k/height-.22)/.78*Math.PI)*height*.29;for(let j=-Math.floor(spread);j<=spread;j++){const hash=Math.abs((j*31+k*17+Math.floor(tree.phase*10))%11);glyph(j===-Math.floor(spread)?'/':j===Math.floor(spread)?'\\':hash<3?'.':hash<6?':':hash<9?'*':'^',x+j,y,colors[tree.layer])}}glyph('/',tree.x-1,base+1,colors[tree.layer]);glyph('\\',tree.x+2,base+1,colors[tree.layer])}
for(let x=0;x<cols;x++){const y=rows*.895+Math.sin(x*.27)*.5;glyph(x%7===0?'"':x%3===0?'_':'.',x,y,'#405440');if(x%9===0)glyph('~',x+(Math.sin(t+x)*2),y+2,'#283c31')}
if(wet)for(const d of drops){d.y+=dt*d.speed*(mode?1.7:1);d.x+=dt*wind*(3+d.z*3);if(d.y>rows*.9){if(d.z>.6)glyph('.',d.x,rows*.9,'#6b8278');d.y=-rand(8);d.x=rand(cols)}if(d.x>cols)d.x=0;if(d.x<0)d.x=cols;glyph(d.z>.75?wind>.6?'/':'|':'.',d.x,d.y,d.z>.75?'#50685e':'#243b33')}
}
function frame(now){const dt=Math.min((now-last)/1000,.06);last=now;if(!stopped){t+=dt;draw(dt)}requestAnimationFrame(frame)}
addEventListener('resize',resize);canvas.addEventListener('pointermove',e=>pointer=(e.clientX/w-.5)*2);canvas.addEventListener('pointerleave',()=>pointer=0);pause.onclick=async()=>{mediaPaused=!mediaPaused;stopped=mediaPaused;pause.textContent=mediaPaused?'▶':'Ⅱ';pause.setAttribute('aria-label',mediaPaused?'Продолжить музыку и анимацию':'Пауза музыки и анимации');pause.title=pause.getAttribute('aria-label');pause.setAttribute('aria-pressed',mediaPaused);rainVolumeUpdate();if(radioAudio&&radioPlaying){if(mediaPaused)radioAudio.pause();else await playRadio()}radioState();if(mediaPaused)caption.textContent='пауза';else if(!radioPlaying)caption.textContent='выбери станцию и нажми ▶'};

function updateRainLevel(){if(rainGain)rainGain.gain.setTargetAtTime(wet?(mode?.09:.045):0,audio.currentTime,.6)}document.querySelectorAll('[data-sky]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.sky);wet=n>0;mode=n===2?1:0;document.querySelectorAll('[data-sky]').forEach(x=>x.setAttribute('aria-pressed',x===b));updateRainLevel();setRain(wet);if(stopped)draw(0)});
let audio,master,rainGain,raining=false,radioAudio,radioPlaying=false,musicVolume=.4,rainVolume=.6;
const caption=$('#caption');function idleCaption(){return ['лоуфай / джаз','ambient / downtempo','лоуфай'][station.value]}function radioError(){radioPlaying=false;radioState();caption.textContent='Радио недоступно'}function rainVolumeUpdate(delay=.08){if(master)master.gain.setTargetAtTime(raining&&!mediaPaused?rainVolume*1.5:0,audio.currentTime,delay)}async function playRadio(){try{if(!mediaPaused)await radioAudio.play()}catch(e){if(!mediaPaused)radioError()}}
async function setRain(on){if(!on&&!audio){raining=false;return}try{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=0;master.connect(audio.destination);const buffer=audio.createBuffer(1,audio.sampleRate*3,audio.sampleRate),data=buffer.getChannelData(0);let brown=0;for(let i=0;i<data.length;i++){brown=(brown+(Math.random()*2-1)*.03)/1.02;data[i]=brown*3}const noise=audio.createBufferSource(),filter=audio.createBiquadFilter();noise.buffer=buffer;noise.loop=true;filter.type='lowpass';filter.frequency.value=1500;rainGain=audio.createGain();rainGain.gain.value=wet?(mode?.09:.045):0;noise.connect(filter);filter.connect(rainGain);rainGain.connect(master);noise.start()}await audio.resume();raining=on;rainVolumeUpdate(.3)}catch(e){caption.textContent='Звук дождя недоступен';console.error(e)}}

const station=$('#station'),stations=[['Code Radio','https://coderadio-admin-v2.freecodecamp.org/listen/coderadio/radio.mp3'],['Groove Salad','https://ice5.somafm.com/groovesalad-128-mp3'],['I Love Chillhop','https://play.ilovemusic.de/ilm_ilovechillhop/']];station.onchange=async()=>{if(radioPlaying){radioAudio.src=stations[station.value][1];caption.textContent='подключение…';await playRadio()}else caption.textContent=idleCaption()};
function radioState(){sound.setAttribute('aria-pressed',radioPlaying&&!mediaPaused);sound.textContent=radioPlaying&&!mediaPaused?'Ⅱ':'▶';sound.setAttribute('aria-label',mediaPaused?'Продолжить музыку и анимацию':radioPlaying?'Остановить радио':'Включить радио');sound.title=sound.getAttribute('aria-label')}
sound.onclick=async()=>{if(mediaPaused){await pause.onclick();if(radioPlaying)return}if(radioPlaying){radioPlaying=false;if(radioAudio){radioAudio.pause();radioAudio.removeAttribute('src');radioAudio.load()}radioState();caption.textContent=idleCaption();return}if(!radioAudio){radioAudio=new Audio();radioAudio.preload='none';radioAudio.volume=musicVolume;radioAudio.addEventListener('playing',()=>{if(mediaPaused){radioAudio.pause();return}caption.textContent='играет'});radioAudio.addEventListener('waiting',()=>{if(radioPlaying&&!mediaPaused)caption.textContent='загрузка…'});radioAudio.addEventListener('error',()=>{if(radioPlaying)radioError()})}radioPlaying=true;radioState();caption.textContent='подключение…';radioAudio.src=stations[station.value][1];setRain(wet);await playRadio()};
['music','rain'].forEach(kind=>{$('#'+kind+'Volume').oninput=e=>{const n=Number(e.target.value)/100;e.target.style.setProperty('--level',e.target.value+'%');$('#'+kind+'Value').value=e.target.value+'%';if(kind==='music'){musicVolume=n;if(radioAudio)radioAudio.volume=n}else{rainVolume=n;rainVolumeUpdate()}}});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey||e.target.closest('input,select,textarea,[contenteditable=true]'))return;if(e.code==='Space'){e.preventDefault();if(!e.repeat)pause.click()}else if(e.code==='KeyM'){e.preventDefault();if(!e.repeat)sound.click()}else if(/^(Digit|Numpad)[012]$/.test(e.code)){e.preventDefault();$('[data-sky="'+e.code.slice(-1)+'"]').click()}else if(e.code==='ArrowUp'||e.code==='ArrowDown'){e.preventDefault();const slider=$(e.shiftKey?'#rainVolume':'#musicVolume');slider.value=Math.max(0,Math.min(100,Number(slider.value)+(e.code==='ArrowUp'?5:-5)));slider.dispatchEvent(new Event('input',{bubbles:true}))}});
resize();requestAnimationFrame(frame);
</script></html>
